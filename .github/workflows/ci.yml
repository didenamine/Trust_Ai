name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trustai
          POSTGRES_PASSWORD: trustai
          POSTGRES_DB: trustai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: trustai
      POSTGRES_PASSWORD: trustai
      POSTGRES_DB: trustai
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-change-me-32-bytes-min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type check + build
        run: npm run build

      - name: Tests
        run: npm test
