# Install once: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix", "--config", "backend/pyproject.toml"]
        files: ^backend/

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--config", "backend/pyproject.toml"]
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-format-lint
        name: prettier + eslint (frontend)
        entry: npm --prefix frontend run lint:fix
        language: system
        files: ^frontend/.*\.(ts|tsx|js|json|css|html)$
        pass_filenames: false
